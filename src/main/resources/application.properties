spring.application.name=etl-reporting-api

# Default profile: in-memory H2 database and a local folder standing in for the S3 bucket.
# Use the "mysql" profile for MySQL + an S3-compatible store (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:etl;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Timeouts for the outbound REST call to the exchange-rate API
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s

# Storage: "local" reads files from app.storage.local-dir, "s3" uses an S3-compatible endpoint
app.storage.type=local
app.storage.local-dir=./data

# Exchange-rate source (public, no API key)
app.rates.base-url=https://api.frankfurter.dev
app.rates.base-currency=USD

# Retry for transient failures (S3 and REST calls): attempts and first back-off, doubled each retry
app.etl.retry-attempts=3
app.etl.retry-initial-delay=500ms
app.etl.chunk-size=500

# Scheduling (ISO-8601 durations measured from the end of the previous run)
app.etl.scheduling.enabled=true
app.etl.initial-delay=PT15S
app.etl.orders-import-interval=PT1M
app.etl.rates-refresh-interval=PT6H

# Optional webhook for failure alerts (Slack-compatible JSON: {"text": "..."}). Empty = log only.
app.alerts.webhook-url=

# MySQL + S3-compatible storage. Values come from the environment: nothing secret is stored in the repo.
# There are deliberately no defaults for these, so the app will not start without them.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.storage.type=s3
app.storage.s3.endpoint=${S3_ENDPOINT}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.bucket=${S3_BUCKET:etl-data}
app.storage.s3.access-key=${S3_ACCESS_KEY}
app.storage.s3.secret-key=${S3_SECRET_KEY}
app.storage.s3.path-style=true

app.alerts.webhook-url=${ALERT_WEBHOOK_URL:}
